# DualBootKit profile: OnePlus 13 (dodge) + ColorOS into slot _b   [TESTED basis]
OS_NAME="ColorOS 16.0.2.403"
SECONDARY_SLOT="_b"
SECONDARY_GROUP="oneplus_dynamic_partitions_b"
KIT_DIR="/sdcard/dualbootkit"            # where this kit + your images live

# bring-your-own firmware/boot images (extract from official COS OZIP). ARB-check!
FW_DIR="$KIT_DIR/coloros/firmware"
FW_IMAGES="abl aop boot dtbo init_boot vendor_boot tz hyp keymaster modem dsp vbmeta vbmeta_system vbmeta_vendor"

# minimal ColorOS logical partitions to carve into super (NO my_stock partition!)
SUPER_DIR="$KIT_DIR/coloros/super"
LOGICAL_PARTS="system:system.img system_ext:system_ext.img product:product.img vendor:vendor.img odm:odm.img"

# loopback data image = ColorOS's entire /data (keeps super footprint tiny)
DATA_IMG="/sdcard/coloros_data.img"
DATA_IMG_SIZE=$((64*1024*1024*1024))     # 64 GiB

# the bulky preinstalled partition goes INSIDE the data image (bind-mounted at boot)
OVERLAY_NAME="my_stock"
OVERLAY_SRC="/sdcard/dualbootkit/coloros/my_stock"   # mounted/extracted my_stock contents
OVERLAY_DEST="coloros_mystock"

# headless boot scripts (relative to KIT_DIR) + device fix-packs
HEADLESS_SCRIPTS="../scripts/coloros-ksu/00-coloros-restore.sh ../scripts/coloros-ksu/01-coloros-wifi-peach.sh"
FIXPACKS="fixpacks/dodge-wifi-peach"
FIXPACK_DEST="adb/coloros_peach_fw_src"  # drop OxygenOS peach board-data here, then point 01-wifi script at it
