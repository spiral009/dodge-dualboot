# DualBootKit profile TEMPLATE - copy + fill for YOUR device/secondary-OS.
# EVERYTHING here is device-specific. Verify partition names with: lpdump
OS_NAME=""                 # e.g. "MIUI 14" / "ColorOS 15"
SECONDARY_SLOT="_b"        # the spare slot your daily ROM is NOT on
SECONDARY_GROUP=""         # from lpdump, e.g. *_dynamic_partitions_b / main_b / qti_dynamic_partitions_b
KIT_DIR="/sdcard/dualbootkit"

FW_DIR="$KIT_DIR/secondary/firmware"
FW_IMAGES="boot dtbo init_boot vendor_boot vbmeta"   # add tz/hyp/modem/etc as your OS needs
SUPER_DIR="$KIT_DIR/secondary/super"
LOGICAL_PARTS="system:system.img product:product.img vendor:vendor.img"  # match your OS's partitions
DATA_IMG="/sdcard/secondary_data.img"
DATA_IMG_SIZE=$((32*1024*1024*1024))
OVERLAY_NAME=""; OVERLAY_SRC=""; OVERLAY_DEST="overlay"   # leave OVERLAY_SRC empty if not needed
HEADLESS_SCRIPTS=""
FIXPACKS=""
FIXPACK_DEST="adb"
